# Odwołanie do Prezesa Krajowej Izby Odwoławczej.
# Keywords are searched on the first pages, ignoring case, whitespace and Polish diacritics.

[classification]
min_score = 4

[classification.keywords]
"odwołujący" = 2
"prezes krajowej izby odwoławczej" = 2   # addressee; KIO rulings say "Prezesa", which does not match
"wnoszę" = 1
"art. 513" = 1                           # legal basis of an appeal (Pzp)
"odwołanie" = 1
"zamawiający" = 1

# Only at the top of the document: KIO rulings start with these and name the same parties, while
# real appeals cite rulings ("wyrok KIO ..., sygn. akt ...") further down, so anywhere else they
# would reject genuine appeals.
[classification.head_keywords]
"sygn. akt" = -5
"wyrok" = -5
"postanowienie" = -5
